<section style="max-width:520px;margin:0 auto;">
  <h2>Iniciar Sesión</h2>
  <p>Accede con tu cuenta para gestionar tu perfil y reservas vinculadas.</p>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <label>Correo electrónico<input type="email" name="email" [(ngModel)]="email" required></label>
    <label>Contraseña<input type="password" name="password" [(ngModel)]="password" required></label>
    <button type="submit" class="btn-hero-primary" style="border:none;cursor:pointer;">Ingresar</button>
    <p *ngIf="msg" style="color:#ff8080;margin-top:.75rem;">{{ msg }}</p>
  </form>
  <p style="margin-top:1rem;">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</section>
