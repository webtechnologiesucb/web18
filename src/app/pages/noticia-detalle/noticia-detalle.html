<section>
  <p><a routerLink="/noticias">← Volver a noticias</a></p>
  <p *ngIf="loading">Cargando noticia...</p>
  <p *ngIf="error" style="color:#e0b0b0;">{{ error }}</p>
  <article *ngIf="!loading && !error && noticia">
    <h2>{{ noticia.titulo }}</h2>
    <p *ngIf="noticia.destacado"><small style="color:var(--color-gold);">★ Noticia destacada</small></p>
    <img *ngIf="noticia.imagen_url" [src]="noticia.imagen_url" [alt]="noticia.titulo" style="width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin:1rem 0;">
    <div style="white-space:pre-line; line-height:1.8;">{{ noticia.contenido }}</div>
  </article>
</section>
